apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-console-backend
  labels: {{- include "kc.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-console-backend
  labels:
    app.kubernetes.io/name: kafka-console-backend
    {{- include "kc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-console-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-console-backend
        app.kubernetes.io/part-of: kafka-console
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: kafka-console-backend
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001        # mounted secrets (mode 0440) readable by the application's group
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.postgres.enabled }}
      initContainers: # wait for the bundled database – the backend would otherwise restart until it is up
        - name: wait-for-postgres
          image: {{ include "kc.image" .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, -c, "until pg_isready -h kafka-console-postgres -p 5432 -U kafkaconsole -q; do sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext: {{- include "kc.containerSecurity" . | nindent 12 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "kc.image" .Values.image.backend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
          env:
            {{- if .Values.postgres.enabled }}
            - { name: DB_URL, value: "jdbc:postgresql://kafka-console-postgres:5432/kafkaconsole" }
            - { name: DB_USER, value: kafkaconsole }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: kafka-console-postgres, key: password }
            {{- else }}
            - { name: DB_URL, value: {{ .Values.database.url | quote }} }
            - { name: DB_USER, value: {{ .Values.database.user | quote }} }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.passwordSecret.name }}, key: {{ .Values.database.passwordSecret.key }} }
            {{- end }}
            - { name: KAFKA_CONSOLE_CLUSTERS_FILE, value: /etc/kafka-console/config/kafka-console.yml }
            - { name: LOGGING_STRUCTURED_FORMAT_CONSOLE, value: ecs }
            {{- if .Values.internalCa.enabled }}
            - { name: KAFKA_CONSOLE_INTERNAL_CA_FILE, value: /etc/kafka-console/ca/{{ .Values.internalCa.key }} }
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - { name: OIDC_ENABLED, value: "true" }
            - { name: OIDC_ISSUER, value: {{ required "oidc.issuer" .Values.oidc.issuer | quote }} }
            - { name: OIDC_CLIENT_ID, value: {{ .Values.oidc.clientId | quote }} }
            - { name: OIDC_REDIRECT_URI, value: {{ required "oidc.redirectUri" .Values.oidc.redirectUri | quote }} }
            - { name: OIDC_CLIENT_SECRET_FILE, value: /etc/kafka-console/oidc/{{ .Values.oidc.clientSecret.key }} }
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- include "kc.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: /etc/kafka-console/config, readOnly: true }
            {{- if .Values.internalCa.enabled }}
            - { name: internal-ca, mountPath: /etc/kafka-console/ca, readOnly: true }
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - { name: oidc, mountPath: /etc/kafka-console/oidc, readOnly: true }
            {{- end }}
            {{- if .Files.Glob "certs/*/*" }}
            - { name: certs, mountPath: /etc/kafka-console/certs, readOnly: true }
            {{- end }}
            {{- range .Values.clusterSecrets }}
            - { name: {{ .name }}, mountPath: {{ .mountPath }}, readOnly: true }
            {{- end }}
            {{- if .Values.vault.enabled }}
            - { name: vault, mountPath: {{ .Values.vault.mountPath }}, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: config
          configMap: { name: kafka-console-config }
        {{- if .Values.internalCa.enabled }}
        - name: internal-ca
          configMap: { name: {{ .Values.internalCa.configMap }} }
        {{- end }}
        {{- if .Values.oidc.enabled }}
        - name: oidc
          secret: { secretName: {{ .Values.oidc.clientSecret.name }}, defaultMode: 0440 }
        {{- end }}
        {{- if .Files.Glob "certs/*/*" }}
        - name: certs
          secret: { secretName: kafka-console-certs, defaultMode: 0440 }
        {{- end }}
        {{- range .Values.clusterSecrets }}
        - name: {{ .name }}
          secret: { secretName: {{ .secretName }}, defaultMode: 0440 }
        {{- end }}
        {{- if .Values.vault.enabled }}
        - name: vault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: kafka-console }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-console-backend
  labels:
    app.kubernetes.io/name: kafka-console-backend
    {{- include "kc.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kafka-console-backend
  ports: # the API only – the management port (probes, metrics) is not in the Service
    - { name: http, port: 8080, targetPort: http }
