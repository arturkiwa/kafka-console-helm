apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-console-frontend
  labels: {{- include "kc.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-console-frontend
  labels:
    app.kubernetes.io/name: kafka-console-frontend
    {{- include "kc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-console-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-console-frontend
        app.kubernetes.io/part-of: kafka-console
    spec:
      serviceAccountName: kafka-console-frontend
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: {{ include "kc.image" .Values.image.frontend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: BACKEND_URL, value: http://kafka-console-backend:8080 }
            - { name: TRUSTED_PROXIES, value: {{ .Values.frontend.trustedProxies | quote }} }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {{- include "kc.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
        - name: nginx-conf
          emptyDir: { sizeLimit: 1Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-console-frontend
  labels:
    app.kubernetes.io/name: kafka-console-frontend
    {{- include "kc.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kafka-console-frontend
  ports:
    - { name: http, port: 8080, targetPort: http }
