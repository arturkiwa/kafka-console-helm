{{- if .Values.postgres.enabled }}
# A single PostgreSQL inside the release (postgres.enabled): data on a PVC, no backup, no replication. The password
# is generated at the first install and kept on upgrades.
{{- $secret := lookup "v1" "Secret" .Release.Namespace "kafka-console-postgres" }}
apiVersion: v1
kind: Secret
metadata:
  name: kafka-console-postgres
  labels: {{- include "kc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep      # the data on the PVC stays usable after an uninstall / reinstall
type: Opaque
data:
  password: {{ if $secret }}{{ index $secret.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-console-postgres
  labels:
    app.kubernetes.io/name: kafka-console-postgres
    {{- include "kc.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kafka-console-postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-console-postgres
  labels:
    app.kubernetes.io/name: kafka-console-postgres
    {{- include "kc.labels" . | nindent 4 }}
spec:
  serviceName: kafka-console-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-console-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-console-postgres
        app.kubernetes.io/part-of: kafka-console
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70           # postgres in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ include "kc.image" .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: POSTGRES_DB, value: kafkaconsole }
            - { name: POSTGRES_USER, value: kafkaconsole }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: kafka-console-postgres, key: password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: [pg_isready, -U, kafkaconsole, -d, kafkaconsole] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, kafkaconsole, -d, kafkaconsole] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "kc.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: { sizeLimit: 16Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.postgres.storage }} }
{{- end }}
