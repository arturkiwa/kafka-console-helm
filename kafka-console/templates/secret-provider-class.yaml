{{- if .Values.vault.enabled }}
# Secrets from Vault as files (Secrets Store CSI driver + Vault provider) – nothing secret in Kubernetes objects.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kafka-console
  labels: {{- include "kc.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.vault.provider }}
  parameters:
    vaultAddress: {{ .Values.vault.vaultAddress | quote }}
    roleName: {{ .Values.vault.roleName | quote }}
    objects: |
      {{- range .Values.vault.objects }}
      - objectName: {{ .objectName | quote }}
        secretPath: {{ .secretPath | quote }}
        secretKey: {{ .secretKey | quote }}
      {{- end }}
{{- end }}
