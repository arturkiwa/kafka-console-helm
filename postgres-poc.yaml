# PostgreSQL tylko do POC: jedna instancja, dane na PVC (domyślna StorageClass). Na produkcji – baza firmowa.
# Hasło bierze z Secret kafka-console-db (klucz password), tego samego co konsola.
apiVersion: v1
kind: Service
metadata:
  name: kafka-console-postgres
  labels: { app.kubernetes.io/name: kafka-console-postgres }
spec:
  selector: { app.kubernetes.io/name: kafka-console-postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-console-postgres
  labels: { app.kubernetes.io/name: kafka-console-postgres }
spec:
  serviceName: kafka-console-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka-console-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka-console-postgres }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: kafkaconsole }
            - { name: POSTGRES_USER, value: kafkaconsole }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: kafka-console-db, key: password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: [pg_isready, -U, kafkaconsole, -d, kafkaconsole] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
