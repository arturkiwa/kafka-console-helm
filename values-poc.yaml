# Kafka Console – ustawienia POC. Zmień to, co oznaczone ZMIEŃ.

host: kafka-console.example.com          # ZMIEŃ: adres, pod którym konsola ma być dostępna

expose:
  type: ingress                          # ingress | none (none = tylko port-forward)
  ingress:
    className: nginx                     # ZMIEŃ: kubectl get ingressclass
    tlsSecretName: ""                    # Secret z certyfikatem dla host; pusty = TLS kończy się przed ingressem

# Baza z postgres-poc.yaml (ten sam namespace). Hasło: Secret kafka-console-db (krok 1).
database:
  url: jdbc:postgresql://kafka-console-postgres:5432/kafkaconsole
  user: kafkaconsole
  passwordSecret: { name: kafka-console-db, key: password }

# ZMIEŃ: klastry Kafki. Inne rodzaje połączeń (SSL, mTLS, JKS) – README, sekcja "Klaster z TLS".
clusters:
  - id: test-01                          # małe litery, cyfry, myślnik; nie zmieniać później
    name: Kafka TEST
    environment: TEST                    # PROD | PREPROD | UAT | TEST | DEV
    bootstrap: kafka-1.example:9092,kafka-2.example:9092
    security: { protocol: PLAINTEXT }
    # schema-registry: { url: http://schema-registry.example:8081 }

clusterSecrets: []                       # pliki certyfikatów – README, "Klaster z TLS"

config:
  access:
    allow-self-grant: true               # POC z jednym administratorem: może nadać uprawnienia sobie

networkPolicy:
  enabled: true
  ingressFrom:                           # ZMIEŃ: namespace kontrolera ingress (kubectl get pods -A | grep ingress)
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
  monitoringNamespace: ""
