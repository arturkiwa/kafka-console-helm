# Kafka Console – ustawienia POC. Zmień to, co oznaczone ZMIEŃ.

# Obrazy. Bez dostępu do Docker Hub: podmień repository na adres w Artifactory, digest zostaje.
image:
  backend:
    repository: docker.io/arturkiwa/kafka-console-backend
    tag: "0.10.2"
    digest: sha256:fb5068ba7b62b88ae17a82382b6970b7110337133c2fcc72af2521a4f31d0e52
  frontend:
    repository: docker.io/arturkiwa/kafka-console-frontend
    tag: "0.10.2"
    digest: sha256:ea55f03c8c540c63588a49248f2ef13b60c9a4fae5ebe7d84f98b76d6d8c5dfa
  pullPolicy: IfNotPresent
imagePullSecrets: []                     # np. [{ name: artifactory-pull }]

host: kafka-console.example.com          # ZMIEŃ: adres, pod którym konsola ma być dostępna

expose:
  type: ingress                          # ingress | none (none = tylko port-forward)
  ingress:
    className: nginx                     # ZMIEŃ: kubectl get ingressclass
    tlsSecretName: ""                    # Secret z certyfikatem dla host; pusty = TLS kończy się przed ingressem

# Baza: PostgreSQL instalowany razem z konsolą (ten sam namespace, hasło generuje Helm, dane na wolumenie 5 GiB).
postgres:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: 17-alpine
    digest: sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
  storageClass: ""                       # pusty = domyślna StorageClass klastra (kubectl get storageclass)

# ZMIEŃ: klastry Kafki.
# Kafka po SSL: wrzuć CA brokera do kafka-console/certs/<id>/ca.crt (np. kafka-console/certs/test-01/ca.crt)
# i ustaw protocol: SSL. Przy mTLS dorzuć tam też tls.crt i tls.key. Nic więcej nie trzeba.
clusters:
  - id: test-01                          # małe litery, cyfry, myślnik; nie zmieniać później
    name: Kafka TEST
    environment: TEST                    # PROD | PREPROD | UAT | TEST | DEV
    bootstrap: kafka-1.example:9093      # nazwy z certyfikatu brokera, nie IP
    security: { protocol: SSL }          # PLAINTEXT, gdy bez TLS

config:
  access:
    allow-self-grant: true               # POC z jednym administratorem: może nadać uprawnienia sobie

networkPolicy:
  enabled: true
  ingressFrom:                           # ZMIEŃ: namespace kontrolera ingress (kubectl get pods -A | grep ingress)
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
  monitoringNamespace: ""
